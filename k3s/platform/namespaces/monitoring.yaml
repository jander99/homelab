---
# kopiur.home-operations.com/privileged-movers=true opts the namespace in
# to kopiur's privileged-mover mode (gate enforced in the kopiur admission
# webhook). Required for monitoring because the kube-prometheus-stack
# operator creates files in the alertmanager and grafana PVCs as root
# during reconciliation, before the workload pods are scheduled and the
# chart-init drops to the non-root user. Without this annotation, the
# kopiur snapshot wedges with
# `PermissionDenied: open /<path>: permission denied` on those root-owned
# files.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    kopiur.home-operations.com/privileged-movers: "true"
