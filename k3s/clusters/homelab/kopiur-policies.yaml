---
# k3s/clusters/homelab/kopiur-policies.yaml
# Flux Kustomization — kopiur SnapshotPolicies + SnapshotSchedules.
#
# Split out from infra-configs because the kopiur admission webhook
# validates cross-resource references (SnapshotPolicy → ClusterRepository)
# at admission time. Flux's per-resource SSA sends each resource through
# the webhook before committing it; co-locating SnapshotPolicy with its
# ClusterRepository in the same Kustomization caused the SnapshotPolicy's
# dry-run to see ClusterRepository "nas" as NotFound (it's still pending
# commit in the same batch). This Kustomization depends on infra-configs
# so the ClusterRepository is committed first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./k3s/infrastructure/configs/kopiur-policies
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-configs
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
