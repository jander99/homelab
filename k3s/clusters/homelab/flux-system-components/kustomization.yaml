# k3s/clusters/homelab/flux-system-components/kustomization.yaml
#
# Build order: load chart output as resources → apply strategic-merge
# patches (delete unused controllers, then patch resource fields) →
# apply the inline JSON 6902 patch that drops the source-watcher
# subject from crd-controller.
# The kustomize-controller reconciles this kustomization and applies
# the resulting manifests to the cluster, taking over resource fields
# set by flux bootstrap (and currently at chart defaults).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
patches:
  - path: patches/remove-unused.yaml
  - path: patches/resource-patch.yaml
  # Drop the CPU limit on each of the 6 Flux controllers (followup to
  # PR #283). resource-patch.yaml's `cpu: null` is a no-op in SMP, so
  # we apply a JSON 6902 op: remove. The same ops file is referenced
  # 6 times with a different Deployment target per entry — kustomize's
  # JSON 6902 transformer requires target at the kustomization entry
  # level, not per-op in the file. P95 values from krr v1.28.0
  # (2026-08-12) — see patches/resource-patch.yaml for the request
  # side. Single-node testbed: CPU throttling hurts reconciliation
  # latency more than it helps.
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: helm-controller
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: image-automation-controller
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: image-reflector-controller
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: notification-controller
  - path: patches/drop-cpu-limit.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
  # source-watcher subject removal from crd-controller. kustomize's
  # strategic-merge $patch: delete does not honor the multi-key merge
  # identifier for subjects (kind+name+namespace), so this uses an
  # inline JSON 6902 patch. source-watcher is the 7th subject (index 6)
  # in the upstream crd-controller subjects list:
  #   0: kustomize-controller
  #   1: helm-controller
  #   2: source-controller
  #   3: notification-controller
  #   4: image-reflector-controller
  #   5: image-automation-controller
  #   6: source-watcher   <-- this entry
  # Re-verify the index after any flux bootstrap that re-renders
  # gotk-components.yaml; the order can change. If so, update the
  # `path: /subjects/N` below.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: crd-controller
    patch: |
      - op: remove
        path: /subjects/6
