# k3s/clusters/homelab/flux-system-components/resource-patch.yaml
#
# Strategic-merge patches for the 6 Flux controllers running in flux-system.
# Applied via kustomize after gotk-components.yaml is loaded and after the
# source-watcher Deployment is removed.
#
# P95 values from krr v1.28.0 run on 2026-08-12 against the testbed.
# Re-run krr quarterly (or after significant workload changes) to refresh.
# CPU limits set to null per krr WARNING — single-node testbed, throttling
# would hurt reconciliation latency more than it would help.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 15m
              memory: 162Mi
            limits:
              # CPU limit removed via drop-cpu-limit.yaml (JSON 6902 patch — SMP null is a no-op)
              memory: 162Mi
---
apiVersion: apps/v1
kind: Deployment
