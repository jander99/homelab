# k3s/clusters/homelab/flux-system-components/remove-unused.yaml
#
# $patch: delete entries for resources declared in gotk-components.yaml
# but not present on the testbed cluster (per `kubectl -n flux-system get ...`
# verified 2026-08-12). flux-system/gotk-components.yaml still references
# source-watcher (Flux v2.5 era); the v2.6+ chart dropped it but this repo
# has not been re-bootstrapped, so the manifest carries dead references.
#
# Without these deletes, applying this kustomization would recreate the
# source-watcher Deployment, ServiceAccount, and Service on the cluster,
# and the crd-controller ClusterRoleBinding would still grant it
# permissions. Deleting the full set matches the running state and avoids
# recreating orphans.
#
# Note: kustomize's strategic-merge `$patch: delete` does not honor
# multi-key merge identifiers (the subjects list merge key is
# kind+name+namespace), so the ClusterRoleBinding subject removal uses
# a JSON 6902 patch by index. source-watcher is the 7th subject in
# crd-controller (index 6). Re-verify this index after any flux
# bootstrap that re-renders gotk-components.yaml.
#
# Verify before adding to this list:
#   kubectl -n flux-system get deploy,sa,svc | grep source-watcher
# (should return nothing).
---
$patch: delete
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-watcher
  namespace: flux-system
---
$patch: delete
apiVersion: v1
kind: ServiceAccount
metadata:
  name: source-watcher
  namespace: flux-system
---
$patch: delete
apiVersion: v1
kind: Service
metadata:
  name: source-watcher
  namespace: flux-system
