---
# k3s/clusters/homelab/flux-system-components.yaml
# Flux Kustomization — Flux controller resource fields.
#
# Reconciles k3s/clusters/homelab/flux-system-components/, a sibling
# kustomization that owns the resource requests/limits for the 6 Flux
# controllers running in flux-system. The path under flux-system/ is
# owned by flux bootstrap and excluded from the parent kustomization
# (flux convention), so this lives at the cluster root and the
# kustomize-controller DOES reconcile it.
#
# force: SSA-takeover of the 6 controller Deployments currently managed
# by flux bootstrap (and currently at chart defaults after the kubectl
# patches from PR #170 were overwritten by Renovate flux-infra-controllers
# updates #232/#221/#211/#205/#201). One-time cost: the kustomize-controller
# restarts once when applying to itself, then steady state.
#
# dependsOn: flux-system — wait for ClusterRoleBindings and ServiceAccounts
# to exist before the controllers start.
#
# prune: if a controller is later removed from gotk-components.yaml
# (chart cleanup, controller consolidation), the Kustomization will delete
# the corresponding Deployment. Safe because each controller has its own
# Deployment and there are no cross-cutting finalizers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system-components
  namespace: flux-system
spec:
  # PHASE 2A — quiesced ahead of the manual Helm takeover.
  #
  # suspend: stops new reconciliations so this Kustomization cannot fight
  # the flux2 HelmRelease over the same 6 controller Deployments during
  # (or after) the manual `helm upgrade --install --take-ownership`.
  #
  # deletionPolicy: Orphan — prevents the eventual Phase 3 deletion of this
  # Kustomization from taking the controllers with it. By then those objects
  # are Helm-owned, but they are still in THIS Kustomization's inventory.
  # The default is MirrorPrune, which "mirrors the Prune field (orphan if
  # false, delete if true)" — and prune is true below, so the default would
  # garbage-collect every inventory entry at Phase 3, including the
  # Helm-owned Deployments, the CRDs and the RBAC. Orphan leaves the whole
  # inventory in place and simply drops the bookkeeping.
  #
  # force and prune are deliberately unchanged: while suspended neither has
  # any effect, and leaving them lets Phase 3 be a pure deletion with no
  # further edits to this file.
  suspend: true
  deletionPolicy: Orphan
  force: true
  dependsOn:
    - name: flux-system
      namespace: flux-system
  interval: 1h
  retryInterval: 2m
  wait: true
  timeout: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/clusters/homelab/flux-system-components
