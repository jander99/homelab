---
# roles/common/tasks/main.yml
# Base OS hardening and package management for all K3s nodes

- name: Validate required variables are defined and non-empty
  ansible.builtin.assert:
    that:
      - k3s_firewall_rules is defined
      - k3s_firewall_rules | length > 0
      - common_packages is defined
      - common_packages | length > 0
      - timezone is defined
      - timezone | length > 0
      - dns_servers is defined
      - dns_servers | length > 0
    fail_msg: >-
      Required variables are missing or empty. Ensure you are running
      ansible-playbook from k3s/bootstrap/ansible/ so that ansible.cfg
      and group_vars/all.yml are picked up correctly.
    quiet: true

# Full OS upgrades (and the reboot they may need) live in playbooks/upgrade-os.yml so a
# provision run never upgrades or reboots a node unexpectedly.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configure passwordless sudo for k3s user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/k3s-nopasswd
    content: "k3s ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: 'visudo -cf %s'

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default policy — deny incoming, allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow required K3s ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ k3s_firewall_rules }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
  notify: Reload UFW

- name: Write netplan DNS override (locks out DHCP-provided DNS)
  ansible.builtin.copy:
    dest: /etc/netplan/99-homelab-dns.yaml
    content: |
      network:
        version: 2
        ethernets:
          {{ ansible_default_ipv4.interface }}:
            nameservers:
              addresses: {{ dns_servers | to_json }}
            dhcp4-overrides:
              use-dns: false
    mode: "0600"
  notify: Apply netplan
  when: not (network_bond.enabled | default(false))
