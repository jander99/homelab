---
# roles/k3s-prereqs/tasks/main.yml
# Kubernetes prerequisites: swap, kernel modules, sysctl, container runtime deps, iSCSI

- name: Check whether swap is currently enabled
  ansible.builtin.command: cat /proc/swaps
  register: k3s_active_swaps
  changed_when: false

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: true
  when: k3s_active_swaps.stdout_lines | length > 1

- name: Remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Persist required kernel modules via /etc/modules-load.d
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      # Kernel modules required by K3s / Kubernetes
      {% for mod in k3s_kernel_modules %}
      {{ mod }}
      {% endfor %}
    mode: "0644"

- name: Load kernel modules immediately
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k3s_kernel_modules }}"

- name: Configure sysctl parameters for K3s networking and writeback
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k3s.conf
    reload: true
    state: present
  loop: "{{ k3s_sysctl_params | combine(k3s_sysctl_extra) | dict2items }}"

- name: Install open-iscsi (required by the Longhorn CSI driver's engine pods)
  ansible.builtin.apt:
    name: open-iscsi
    state: present

- name: Ensure iscsid is running and enabled
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

# multipathd grabs Longhorn's iSCSI disks (IET VIRTUAL-DISK) as mpath maps, after which
# the kernel refuses the direct mount ("already mounted or mount point busy").
- name: Blacklist sd devices from multipath (Longhorn volumes are iSCSI sd* devices)
  ansible.builtin.copy:
    dest: /etc/multipath.conf
    mode: "0644"
    content: |
      defaults {
          user_friendly_names yes
      }
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  register: multipath_conf

- name: Flush stale multipath maps and restart multipathd
  ansible.builtin.shell: multipath -F; systemctl restart multipathd
  when: multipath_conf.changed
  failed_when: false
  changed_when: true
