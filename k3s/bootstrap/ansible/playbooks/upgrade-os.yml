---
# upgrade-os.yml
# Upgrades all OS packages and reboots nodes that need it, one node at a time so etcd
# keeps quorum. Kept out of provision-nodes.yml so provisioning never reboots a node.
#
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/upgrade-os.yml -v

- name: Upgrade OS packages
  hosts: all
  become: true
  serial: 1
  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot node if required
      ansible.builtin.reboot:
        msg: "Rebooting to apply OS upgrade"
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists
