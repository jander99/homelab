---
# K3s Cluster Inventory
# Single-node K3s server (embedded etcd, k3s_init_cluster: true). See BOOTSTRAP.md Part 2 for HA upgrade path.
#
# Testbed: i7-4770k at 192.168.1.128 — re-IP to 192.168.1.4x before joining cluster
# Target cluster IPs: 192.168.1.40, 192.168.1.41, 192.168.1.42

all:
  vars:
    ansible_user: k3s
    ansible_ssh_private_key_file: ~/.ssh/k3s_cluster
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_servers:
      hosts:
        testbed:
          ansible_host: 192.168.1.128

    # Nodes with an NVIDIA GPU; only these get the nvidia-gpu role. Add a node here when it gets one.
    gpu_nodes:
      hosts:
        testbed:

    # Uncomment as additional nodes are provisioned. Naming: k3s-<last octet of the IP>.
    # (The testbed keeps its name: kubeconfig/token paths and host_vars are keyed on it.)
    # k3s-40:
    #   ansible_host: 192.168.1.40
    # k3s-41:
    #   ansible_host: 192.168.1.41
    # k3s-42:
    #   ansible_host: 192.168.1.42
