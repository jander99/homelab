---
# inventory/host_vars/testbed.yml
# Host vars that Ansible actually loads when running playbooks/*.yml (inventory-adjacent).

# i7-4770k, ASUS Z87-PRO, Intel I217-V (eno1) + TP-LINK TX201/RTL8125 (enp2s0)
network_bond:
  enabled: true
  name: bond0
  interfaces:
    - eno1
    - enp2s0
  # Pin to eno1 MAC so Unifi DHCP reservation survives (unused with static IP,
  # but kept for clarity and in case DHCP is ever re-enabled).
  macaddress: "e0:3f:49:9f:b3:dd"
  address: "192.168.1.128/24"
  gateway: "192.168.1.1"
  parameters:
    mode: 802.3ad
    lacp_rate: fast
    mii_monitor_interval: 100
    transmit_hash_policy: layer3+4

# Samsung 980 PRO 2TB (PCIe Gen2 x4 on this board). ~260G of the VG is left unallocated
# on purpose so volumes can grow with `lvextend -r` later.
nvme_storage:
  enabled: true
  device: /dev/disk/by-id/nvme-Samsung_SSD_980_PRO_2TB_S6B0NG0RA47707K
  vg_name: nvme-vg
  volumes:
    - { name: longhorn, size: 1500g, mount: /mnt/nvme/longhorn }
    - { name: k3s-db, size: 100g, mount: /mnt/nvme/k3s-db }
  # etcd's WAL fsync latency is what the cluster feels; keep its dir on NVMe. snapshots/ stays
  # on the root disk on purpose (a backup should not share a device with the data it protects).
  bind_mounts:
    - { src: /mnt/nvme/k3s-db/etcd, path: /var/lib/rancher/k3s/server/db/etcd }

# k3s must never start before these are mounted, or it would create a fresh empty etcd.
k3s_required_mounts:
  - /var/lib/rancher/k3s/server/db/etcd
