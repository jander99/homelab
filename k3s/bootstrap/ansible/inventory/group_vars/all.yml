---
# Variables applied to all hosts

timezone: America/New_York

# Packages installed on every node
common_packages:
  - python3
  - python3-pip
  - curl
  - wget
  - git
  - vim
  - htop
  - unzip
  - jq
  - update-notifier-common
  - cifs-utils
  - smartmontools  # SSD health (smartctl); etcd + Longhorn share one consumer SSD

# DNS servers written to /etc/netplan/99-homelab-dns.yaml — overrides DHCP-provided DNS.
dns_servers:
  - 192.168.1.2
  - 192.168.1.201

# UFW rules — K3s required ports + SSH
k3s_firewall_rules:
  - { port: 22,    proto: tcp, comment: "SSH" }
  - { port: 6443,  proto: tcp, comment: "Kubernetes API server" }
  - { port: 10250, proto: tcp, comment: "Kubelet API" }
  - { port: 8472,  proto: udp, comment: "Flannel VXLAN" }
  # Embedded etcd client/peer, for the HA servers only (LAN-restricted). Harmless on one node.
  - { port: 2379,  proto: tcp, from: 192.168.1.0/24, comment: "etcd client" }
  - { port: 2380,  proto: tcp, from: 192.168.1.0/24, comment: "etcd peer" }
# WireGuard (51820/udp) is not opened: flannel-backend is vxlan.

# Kernel modules and base sysctls come from the k3s-prereqs role defaults. Only additions go
# here: k3s_sysctl_extra is merged over k3s_sysctl_params (role default), never replaces it.
k3s_sysctl_extra:
  # Inotify limits for fsnotify-based controllers (nvidia-device-plugin,
  # kube-state-metrics, cilium, etc.). The Linux kernel defaults to
  # max_user_instances=128; containerd-shim on cgroup v2 holds >=1 inotify
  # instance per container for memory.events monitoring, plus every fsnotify
  # watcher adds another. Dense nodes exhaust the default at ~70 pods and the
  # nvidia-device-plugin (and similar) CrashLoopBackOff with
  #   "failed to create FS watcher for /var/lib/kubelet/device-plugins/:
  #    too many open files"
  # See containerd/containerd#10468 and NVIDIA/gpu-operator#441.
  # 8192 is the convention from the Crusoe support KB; covers HA clusters
  # at hundreds of pods without re-tuning.
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192

# K3s version installed on NEW nodes. Existing nodes are never touched by Ansible: upgrades are
# done by system-upgrade-controller from the Plan in infrastructure/configs/system-upgrade-controller.
# Renovate bumps this together with that Plan's `version`.
# renovate: datasource=github-releases depName=k3s-io/k3s versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?<prerelease>)\+k3s(?<build>\d+)$
k3s_version: "v1.36.5+k3s1"

# Use embedded etcd instead of SQLite. K3s migrates existing SQLite data into
# etcd in place on restart (state.db is renamed aside afterward, not reused) —
# see BOOTSTRAP.md Part 2 for details. Fixes the kine/SQLite leader-election
# lease-contention ceiling tracked in #355. No firewall changes needed:
# ports 2379/2380 are only required for multi-server etcd peer traffic.
k3s_init_cluster: true

# Single-node testbed only: a lease-renew timeout during etcd stalls crashes k3s (see roles/k3s-server).
# REMOVE (or set false) when the other two servers join — HA needs leader election.
k3s_disable_leader_election: true

# K3s built-in components to disable — these are replaced by external controllers.
# servicelb (klipper-lb) must be disabled when MetalLB is installed to prevent
# both controllers competing for LoadBalancer services.
k3s_disable_components:
  - servicelb

# ─── Flux CD bootstrap settings ─────────────────────────────────────────────
# Environment-specific values for the flux-bootstrap role.
# These override the empty role defaults in roles/flux-bootstrap/defaults/main.yml.
flux_github_owner: "jander99"
flux_github_repo: "homelab"
flux_git_branch: "master"

# ─── K3s OIDC settings ───────────────────────────────────────────────────────
# Configures the K3s API server to validate OIDC tokens issued by Authentik.
# These values enable Headlamp SSO via the headlamp application in Authentik.
k3s_oidc_issuer_url: "https://auth.homelab.properties/application/o/headlamp/"
k3s_oidc_client_id: "headlamp"
k3s_oidc_username_claim: "preferred_username"
k3s_oidc_groups_claim: "groups"

