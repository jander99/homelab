---
# k3s/infrastructure/configs/kopiur-policies/snapshotpolicy-prometheus.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
      sourcePathOverride: /prometheus/prometheus-db
  copyMethod: Snapshot
  volumeSnapshotClassName: longhorn-snapclass
  compression:
    compressor: zstd
  # Metrics are rebuildable and large: keep fewer, less frequent restore points than config volumes.
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 2000
    podSecurityContext:
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 2Gi
      storageClassName: local-path
      mode: Ephemeral
