---
# k3s/infrastructure/configs/kopiur-policies/snapshotpolicy-pihole.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: pihole
  namespace: pihole
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: pihole
      sourcePathOverride: /etc/pihole
  copyMethod: Snapshot
  # Migrated from csi-hostpath-snapclass to longhorn-snapclass in
  # feat/pihole-longhorn. The pihole PVC is now on the `longhorn` StorageClass
  # (PR prepping the move in helmrelease.yaml), so the CSI snapshot must use
  # the matching Longhorn VolumeSnapshotClass.
  volumeSnapshotClassName: longhorn-snapclass
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    # Pihole's official image starts as root and drops to the `pihole` user
    # (UID 1000 GID 1000), but the chart-init creates `/etc/pihole/logrotate`
    # as `root:root` mode 0640 during startup, BEFORE the user drop. The
    # pihole user cannot read it back. Snapshotting as UID 1000 fails with
    # PermissionDenied on that single file, killing the whole backup.
    #
    # Run the mover as root for pihole specifically. Opt-in via:
    #   kubectl annotate namespace pihole kopiur.home-operations.com/privileged-movers=true
    # (see k3s/platform/namespaces/pihole.yaml).
    # privilegedMode also preserves UID/GID on restore, which matters for
    # the pihole-FTL.db / gravity.db files that pihole opens as pihole:pihole.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    privilegedMode: true
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
