---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: headlamp-scheduled
  namespace: headlamp
spec:
  policyRef:
    name: headlamp
  schedule:
    # Fixed offset instead of H-hash: with only 16 policies across 60 minutes,
    # the hash clustered 5 of them within a 5-minute window (2026-08-30,
    # 01:14-01:19 UTC), triggering a disk I/O spike that burned the apiserver
    # error budget (#363). Schedules use explicit minutes, and since the
    # single-node disk (etcd + Longhorn) cannot absorb 16 hourly clone+backup
    # cycles without lease 504s, each runs every 4-12h at a distinct
    # hour/minute so no two fire within ~4 min of each other.
    cron: "15 1,13 * * *"
    runOnCreate: false
