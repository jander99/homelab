---
# k3s/infrastructure/configs/kopiur-policies/snapshotpolicy-portainer.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: portainer
  namespace: portainer
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: portainer
      sourcePathOverride: /data
  copyMethod: Snapshot
  # Migrated from csi-hostpath-snapclass to longhorn-snapclass in
  # feat/portainer-longhorn. The portainer PVC is now on the `longhorn`
  # StorageClass (PR prepping the move in helmrelease.yaml), so the
  # CSI snapshot must use the matching Longhorn VolumeSnapshotClass.
  volumeSnapshotClassName: longhorn-snapclass
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    # portainer/portainer-ce runs as root (UID 0, GID 0). The namespace
    # carries `kopiur.home-operations.com/privileged-movers: "true"`
    # because kopiur's admission treats runAsUser: 0 as "privileged" —
    # without the opt-in annotation the SnapshotPolicy is blocked with
    # `PrivilegedMoverNotPermitted` (caught at first scheduled run).
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    podSecurityContext:
      fsGroup: 0
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
