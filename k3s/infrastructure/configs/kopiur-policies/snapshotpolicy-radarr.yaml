---
# k3s/infrastructure/configs/kopiur-policies/snapshotpolicy-radarr.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: radarr
  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: radarr-config
      sourcePathOverride: /config
  copyMethod: Snapshot
  # Migrated from csi-hostpath-snapclass to longhorn-snapclass in
  # feat/radarr-longhorn. The radarr-config PVC is now on the `longhorn`
  # StorageClass (PR prepping the move in pvc.yaml), so the CSI snapshot
  # must use the matching Longhorn VolumeSnapshotClass.
  volumeSnapshotClassName: longhorn-snapclass
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    # LinuxServer radarr image runs as abc (PUID=1027, PGID=100); matches
    # prowlarr since both apps share the same LinuxServer base.
    securityContext:
      runAsUser: 1027
      runAsGroup: 100
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
