---
# k3s/infrastructure/configs/kopiur-policies/snapshotpolicy-tdarr-server-data.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: tdarr-server-data
  namespace: tdarr
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: tdarr-server-data
      sourcePathOverride: /app/server
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-hostpath-snapclass
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    # LinuxServer tdarr image (PUID=1027, PGID=100); same recipe as
    # qbittorrent/sabnzbd. The namespace carries
    # `kopiur.home-operations.com/privileged-movers: "true"` so the
    # snapshot can also read any root-owned files left behind by the
    # tdarr-server image's entrypoint before the user drop.
    securityContext:
      runAsUser: 1027
      runAsGroup: 100
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
