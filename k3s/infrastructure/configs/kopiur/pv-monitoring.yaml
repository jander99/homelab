---
# Repository storage for kopiur snapshot Jobs in the monitoring namespace.
# Static PV + PVC pair bound to the smb-media CSI provisioner. Mounts the
# dedicated backup SMB sub-share \\MemoryAlpha\backups\. Shares the SMB
# source with all other kopiur-repo PVs — each namespace has its own mount
# = its own SMB session.
#
# uid/gid=1000/2000 matches the kube-prometheus-stack alertmanager and
# grafana containers (both default to UID 1000; alertmanager uses GID 2000
# in the kube-prometheus-stack image). One PV per namespace is shared by
# the alertmanager and grafana SnapshotPolicies.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopiur-repo-monitoring
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-media
  mountOptions:
    - vers=3.0
    - dir_mode=0777
    - file_mode=0777
    - uid=1000
    - gid=2000
    - noperm
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: kopiur-repo-monitoring-vol
    volumeAttributes:
      source: //192.168.1.20/backups
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopiur-repo
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-media
  volumeName: kopiur-repo-monitoring
  resources:
    requests:
      storage: 50Gi