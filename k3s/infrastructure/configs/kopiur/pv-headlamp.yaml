---
# Repository storage for kopiur snapshot Jobs in headlamp. Static PV + PVC
# pair bound to the existing smb-media CSI provisioner. Shares the SMB
# source path with pv-kopiur-system.yaml and pv-gatus.yaml — each namespace
# has its own mount = its own SMB session to //192.168.1.20/data. Kopia's
# content-addressable storage makes concurrent multi-mount writes safe
# (different jobs write to different blob files).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopiur-repo-headlamp
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-media
  mountOptions:
    - vers=3.0
    - dir_mode=0777
    - file_mode=0777
    - uid=1027
    - gid=100
    - noperm
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: kopiur-repo-headlamp-vol
    volumeAttributes:
      source: //192.168.1.20/data
      # Bind SMB subdirectory so the pod's mount path maps to
      # \\MemoryAlpha\data\backups\k3s\ instead of the share root.
      # NOTE: csi-driver-smb uses the key `subDir`, NOT `subPath`
      # (CephFS-style). The driver silently ignores unknown keys,
      # so PR #275's `subPath: backups/k3s` left every mover Pod
      # mounted at the share root and Kopia wrote \\MemoryAlpha\data\.
      #
      # PREREQUISITE: the SMB subdirectory must pre-exist on the share
      # before any mover Pod runs. NodeStageVolume only mounts; it does
      # NOT create the subdirectory (auto-create only happens in
      # CreateVolume, which is the dynamic-provisioning path —
      # irrelevant for static PVs). Without the dir, the CIFS client
      # silently falls back to the share root on this kernel and Kopia
      # writes to the existing repo at \\MemoryAlpha\data\.
      subDir: backups/k3s
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopiur-repo
  namespace: headlamp
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-media
  volumeName: kopiur-repo-headlamp
  resources:
    requests:
      storage: 50Gi
