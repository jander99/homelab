---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: gatus
  namespace: gatus
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: gatus
      sourcePathOverride: /data
  copyMethod: Snapshot
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  verification:
    quick:
      schedule:
        cron: "H 3 * * *"
  credentialProjection:
    enabled: true
  mover:
    # gatus image is a Go binary; the chart's stock UID/GID is 1000:1000.
    # Verify with `kubectl describe pod -n gatus` if the first mover run
    # fails on permission denied.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
