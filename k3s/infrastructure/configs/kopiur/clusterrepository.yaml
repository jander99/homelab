---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  # Match Billimek's pattern: every namespace can use this repo. Tighten with
  # a label selector later if needed.
  allowedNamespaces:
    all: true

  backend:
    filesystem:
      # Pod mount path for the kopiur-repo PVC. The PVs in pv-*.yaml mount
      # the dedicated backup SMB sub-share \\MemoryAlpha\backups\ (separate
      # from \\MemoryAlpha\data\ used by the media stack), so `/repo` inside
      # the mover Pod maps to the root of that sub-share. Kopia's filesystem
      # backend initialises the repository here via
      # `kopia repository create filesystem --path=/repo`, creating
      # kopia.repository, blobs/, index/, logs/ on first reconcile.
      #
      # Why a dedicated sub-share rather than a subdir on \\MemoryAlpha\data\:
      # kopiur 0.9.1 uses `spec.backend.filesystem.path` verbatim as BOTH
      # the Kubernetes `mount_path` AND the kopia `--path` argument (no
      # normalization, no path-relative-to-mount). PRs #275/#276 tried
      # putting the repo at `\\MemoryAlpha\data\backups\k3s\` via the csi
      # driver's `subDir` key — but the Linux CIFS client on this kernel
      # silently ignores path components in the mount source, falling back
      # to the share root regardless. The CIFS kernel limitation makes
      # share-level isolation via subDir unreliable. A dedicated SMB
      # sub-share is the only clean fix on this kernel.
      #
      # SMB auth is handled by csi-driver-smb via kube-system/smbcreds on
      # each PV; the SMB user must have write access to the share root.
      path: /repo
      volume:
        pvc:
          name: kopiur-repo

  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD

  # Greenfield repo at the new path — let kopiur initialize the Kopia
  # repository on first reconcile via
  # `kopia repository create filesystem --path=/repo`. Any pre-existing
  # files at the SMB share root (\\MemoryAlpha\data\kopia.repository, blobs/,
  # index/, logs/) are orphaned by this change; operator deletes them
  # manually after verifying fresh snapshots land in
  # \\MemoryAlpha\data\backups\k3s\.
  create:
    enabled: true

  # Consumers (SnapshotPolicy / Restore / Maintenance) MUST set
  # credentialProjection.enabled: true to project this Secret into their
  # own namespace at runtime. Without this, the per-consumer gate fails
  # closed.
  credentialProjection:
    allowed: true

  # Match HelmRelease TZ so schedules and reports use local time, not UTC.
  scheduleDefaults:
    timezone: America/New_York

  # Kopia's default 24h epoch can't close fast enough on a busy repo
  # ("too many index blobs" warning, climbing every run). Lowering to 6h
  # matches kopiur's default quick-maintenance cadence so an epoch
  # actually closes and compacts each cycle. (From billimek PR #5861.)
  parameters:
    epoch:
      minDuration: 6h

  moverDefaults:
    podSecurityContext:
      runAsNonRoot: true
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      mode: Ephemeral
      storageClassName: local-path
