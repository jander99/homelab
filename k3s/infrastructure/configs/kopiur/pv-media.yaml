---
# Repository storage for kopiur snapshot Jobs in the media namespace.
# Static PV + PVC pair bound to the smb-media CSI provisioner. Mounts the
# dedicated backup SMB sub-share \\MemoryAlpha\backups\ (separate from
# \\MemoryAlpha\data\ used by the media stack). Shares the SMB source with
# pv-kopiur-system.yaml, pv-headlamp.yaml, pv-gatus.yaml — each namespace
# has its own mount = its own SMB session. Kopia's content-addressable
# storage makes concurrent multi-mount writes safe (different jobs write
# to different blob files).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopiur-repo-media
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-media
  mountOptions:
    - vers=3.0
    - dir_mode=0777
    - file_mode=0777
    - uid=1027
    - gid=100
    - noperm
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: kopiur-repo-media-vol
    volumeAttributes:
      source: //192.168.1.20/backups
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopiur-repo
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-media
  volumeName: kopiur-repo-media
  resources:
    requests:
      storage: 50Gi