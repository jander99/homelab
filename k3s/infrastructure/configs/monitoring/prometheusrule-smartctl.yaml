---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: smartctl.rules
      rules:
        - alert: DiskSmartStatusFailed
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART health check failed on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} reports SMART overall-health FAILED. Back up data and replace the drive."

        - alert: NvmeCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe critical warning on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} has a non-zero NVMe critical_warning bitmask ({{ $value }}): spare low, temperature, reliability, read-only, or volatile backup failure."

        # media_errors is a lifetime counter (can be non-zero forever), so alert on growth only.
        - alert: NvmeMediaErrorsIncreasing
          expr: increase(smartctl_device_media_errors[1d]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NVMe media errors increasing on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} logged {{ $value }} new media/data-integrity errors in the last 24h."

        - alert: NvmeAvailableSpareLow
          expr: |
            smartctl_device_available_spare < 20
            or smartctl_device_available_spare <= smartctl_device_available_spare_threshold
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NVMe available spare low on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} available spare is {{ $value }}% (alerts below 20% or at the drive's own threshold)."

        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used >= 80
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe wear high on {{ $labels.device }}"
            description: "Drive {{ $labels.device }} has used {{ $value }}% of its rated endurance. Plan a replacement."

        - alert: DiskTemperatureHigh
          expr: |
            (smartctl_device_temperature{temperature_type="current",device=~"nvme.*"} >= 70)
            or (smartctl_device_temperature{temperature_type="current",device!~"nvme.*"} >= 55)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} is running hot"
            description: "Drive {{ $labels.device }} temperature is {{ $value }}C for 15 minutes (thresholds: NVMe 70C, SATA 55C)."

        - alert: DiskTemperatureCritical
          expr: |
            (smartctl_device_temperature{temperature_type="current",device=~"nvme.*"} >= 80)
            or (smartctl_device_temperature{temperature_type="current",device!~"nvme.*"} >= 65)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} temperature critical"
            description: "Drive {{ $labels.device }} temperature is {{ $value }}C (thresholds: NVMe 80C, SATA 65C). Check cooling."

        - alert: SmartctlExporterDown
          expr: |
            up{job="prometheus-smartctl-exporter"} == 0
            or absent(up{job="prometheus-smartctl-exporter"})
            or absent(smartctl_device_smart_status)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "smartctl exporter is down or reporting no drives"
            description: "No SMART data has been scraped for 10 minutes, so disk health alerts are blind."
