---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: "2026.8.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_SECRET_KEY
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      targetPath: authentik.bootstrap.password
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_BOOTSTRAP_TOKEN
      targetPath: authentik.bootstrap.token
    - kind: Secret
      name: authentik-secret
      valuesKey: postgresql-password
      targetPath: postgresql.auth.password
    - kind: Secret
      name: authentik-secret
      valuesKey: redis-password
      targetPath: redis.auth.password
    - kind: Secret
      name: authentik-secret
      valuesKey: grafana-oidc-client-secret
      targetPath: authentik.env.GRAFANA_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: headlamp-oidc-client-secret
      targetPath: authentik.env.HEADLAMP_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: portainer-oidc-client-secret
      targetPath: authentik.env.PORTAINER_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: gatus-oidc-client-secret
      targetPath: authentik.env.GATUS_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: postgresql-password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secret
      valuesKey: redis-password
      targetPath: authentik.redis.password
  values:
    authentik:
      postgresql:
        host: "authentik-postgresql"
        name: authentik
        user: authentik
      redis:
        host: "authentik-redis-master"

    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
      primary:
        resources:
          requests:
            cpu: 25m
            memory: 400Mi
          limits:
            memory: 512Mi
        persistence:
          size: 2Gi
          # -- Migrated from csi-hostpath-sc to longhorn in
          # feat/authentik-longhorn. The Restore CR in
          # k3s/applications/authentik/migration/restore.yaml creates a new
          # data-authentik-postgresql-0 PVC on longhorn and populates it from
          # the latest kopia snapshot; the StatefulSet's volumeClaimTemplate
          # then matches what's already there. (Prior history: migrated from
          # local-path to csi-hostpath-sc imperatively via an intermediate
          # PVC + two rsync stages, manifests still in
          # `k3s/applications/authentik/migration/` for the record.)
          storageClass: longhorn

    redis:
      enabled: true
      auth:
        enabled: true
      master:
        persistence:
          size: 512Mi
          storageClass: local-path

    server:
      # Hardening: chart's server.securityContext/containerSecurityContext
      # both default to {} (fully open) despite the values existing.
      # ghcr.io/goauthentik/server runs as uid/gid 1000 by default (per the
      # chart's own commented example above), so pin that explicitly rather
      # than relying on the image default.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      # readOnlyRootFilesystem intentionally left unset: the server writes
      # runtime state (media uploads, generated certs/templates) to its own
      # filesystem and this branch can't be live-tested against Flux before
      # merge to confirm every write path is already covered by a mounted
      # volume.
      resources:
        requests:
          cpu: 600m
          memory: 1Gi
        limits:
          memory: 1500Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - auth.homelab.properties
        tls:
          - secretName: authentik-tls
            hosts:
              - auth.homelab.properties

    worker:
      # Hardening: same rationale as server.securityContext above.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      # readOnlyRootFilesystem intentionally left unset: the worker runs
      # blueprint reconciliation and background tasks that can write to its
      # own filesystem (e.g. GeoIP DBs, temp files); same live-test caveat
      # as server above.
      # Tell the worker where to discover custom blueprints. The
      # ConfigMap is already mounted at /blueprints/custom (see volumes
      # below); without this env var, the worker doesn't scan the
      # directory and the blueprints sit inert. The existing providers
      # (grafana / headlamp / portainer) were applied via the Authentik
      # UI/API before this discovery loop existed; their blueprint files
      # in the ConfigMap are the git-tracked export of that state.
      # The gatus-provider.yaml added in #243 needs this scanning to
      # actually land as live providers + applications.
      env:
        - name: AUTHENTIK_BLUEPRINTS_DIR
          value: /blueprints/custom
      resources:
        requests:
          cpu: 100m
          memory: 800Mi
        limits:
          memory: 1Gi
      volumes:
        - name: custom-blueprints
          configMap:
            name: authentik-blueprints
      volumeMounts:
        - name: custom-blueprints
          mountPath: /blueprints/custom

    # Audit finding (PR #373) tried disabling this to drop the unused
    # authentik-remote-cluster RBAC (broad namespaced Role on secrets/
    # services/configmaps/deployments/ingresses/etc. — see
    # charts/authentik-remote-cluster/templates/role.yaml at chart version
    # 2.1.0). That broke the live cluster: the worker/server Deployment
    # templates hardcode `serviceAccountName: authentik`
    # (serviceAccount.fullnameOverride) regardless of this flag — disabling
    # `create` only stops the ServiceAccount object from being created, it
    # does NOT change what the pods reference, so the worker rollout got
    # stuck on `FailedMount: serviceaccounts "authentik" not found`.
    # `authentik-remote-cluster` is aliased in as a single dependency gated
    # by this one condition (Chart.yaml: `alias: serviceAccount, condition:
    # serviceAccount.create`) — the chart bundles the ServiceAccount and the
    # broad RBAC together with no finer-grained toggle to split them.
    # Reverted to the chart default (true) to restore function. Dropping the
    # unused RBAC cleanly would require a postRenderer patch to delete just
    # the Role/RoleBinding/ClusterRole/ClusterRoleBinding objects while
    # leaving the ServiceAccount itself — left as a follow-up, not attempted
    # here given the live-breakage urgency.
    serviceAccount:
      create: true
