---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: "2026.8.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_SECRET_KEY
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      targetPath: authentik.bootstrap.password
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_BOOTSTRAP_TOKEN
      targetPath: authentik.bootstrap.token
    - kind: Secret
      name: authentik-secret
      valuesKey: postgresql-password
      targetPath: postgresql.auth.password
    - kind: Secret
      name: authentik-secret
      valuesKey: redis-password
      targetPath: redis.auth.password
    - kind: Secret
      name: authentik-secret
      valuesKey: grafana-oidc-client-secret
      targetPath: authentik.env.GRAFANA_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: headlamp-oidc-client-secret
      targetPath: authentik.env.HEADLAMP_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: outpost-token
      targetPath: authentik.env.OUTPOST_TOKEN
    - kind: Secret
      name: authentik-secret
      valuesKey: portainer-oidc-client-secret
      targetPath: authentik.env.PORTAINER_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: gatus-oidc-client-secret
      targetPath: authentik.env.GATUS_OIDC_CLIENT_SECRET
    - kind: Secret
      name: authentik-secret
      valuesKey: postgresql-password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secret
      valuesKey: redis-password
      targetPath: authentik.redis.password
  values:
    authentik:
      postgresql:
        host: "authentik-postgresql"
        name: authentik
        user: authentik
      redis:
        host: "authentik-redis-master"

    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
      primary:
        resources:
          requests:
            cpu: 25m
            memory: 400Mi
          limits:
            memory: 512Mi
        persistence:
          size: 2Gi
          # -- csi-hostpath-sc is the only SC in this cluster that supports
          # VolumeSnapshots, which is required for kopiur backup coverage.
          # Migration from local-path was performed imperatively (the chart
          # value change alone wouldn't move the existing PVC); the imperative
          # flow uses an intermediate `authentik-postgresql-hostpath` PVC on
          # csi-hostpath-sc, an rsync stage-1 (with postgres quiesced), then
          # the chart-managed `data-authentik-postgresql-0` PVC recreated on
          # csi-hostpath-sc and an rsync stage-2 into it. Manifests in
          # `k3s/applications/authentik/migration/`.
          storageClass: csi-hostpath-sc

    redis:
      enabled: true
      auth:
        enabled: true
      master:
        persistence:
          size: 512Mi
          storageClass: local-path

    server:
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 1500Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - auth.homelab.properties
        tls:
          - secretName: authentik-tls
            hosts:
              - auth.homelab.properties

    worker:
      # Tell the worker where to discover custom blueprints. The
      # ConfigMap is already mounted at /blueprints/custom (see volumes
      # below); without this env var, the worker doesn't scan the
      # directory and the blueprints sit inert. The existing providers
      # (grafana / headlamp / portainer) were applied via the Authentik
      # UI/API before this discovery loop existed; their blueprint files
      # in the ConfigMap are the git-tracked export of that state.
      # The gatus-provider.yaml added in #243 needs this scanning to
      # actually land as live providers + applications.
      env:
        - name: AUTHENTIK_BLUEPRINTS_DIR
          value: /blueprints/custom
      resources:
        requests:
          cpu: 100m
          memory: 800Mi
        limits:
          memory: 1Gi
      volumes:
        - name: custom-blueprints
          configMap:
            name: authentik-blueprints
      volumeMounts:
        - name: custom-blueprints
          mountPath: /blueprints/custom
