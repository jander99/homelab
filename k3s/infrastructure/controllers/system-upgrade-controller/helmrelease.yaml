---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Single rancher-charts HelmRepository shared with other Rancher charts
  # in this repo (flux-system namespace); this HelmRelease scopes chart
  # name to avoid sourceRef collisions.
  name: system-upgrade-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: system-upgrade-controller
      # Chart versions on charts.rancher.io are arbitrarily-numbered
      # (109.x = appVersion 0.19.x, 110.x = 0.20.x); Renovate bumps this
      # via the helm-values datasource.
      version: "110.0.0"
      sourceRef:
        kind: HelmRepository
        name: rancher-charts
        namespace: flux-system
  # The rancher-charts `system-upgrade-controller` chart hardcodes the
  # `cattle-system` namespace in its ServiceAccount / Deployment /
  # ClusterRoleBinding templates — `targetNamespace` is ignored. The
  # chart's installed SA there is named `system-upgrade-controller` and
  # is what Plan resources reference.
  #
  # The bare upstream manifest (rancher/system-upgrade-controller
  # manifests/system-upgrade-controller.yaml) uses `system-upgrade` and
  # was what #344 originally targeted — but that is the deprecated
  # direct-deploy manifest, not the chart. The chart is what Flux needs
  # to drive upgrades.
  targetNamespace: cattle-system
  install:
    createNamespace: true
    # Chart ships the Plan CRDs (upgrade.cattle.io/v1); same CRD strategy
    # as snapshot-controller (#1451 / #1474). CreateReplace re-applies the
    # CRDs on every chart bump so any new Plan fields reach the cluster.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Resources: chart default is unbounded. Floor (10m/100Mi) matches the
    # snapshot-controller pattern (#1451) — no CPU limit per #284.
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
