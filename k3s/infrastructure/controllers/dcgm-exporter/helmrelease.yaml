---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: dcgm-exporter
      version: '4.8.3'
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
        namespace: flux-system
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: nvidia-device-plugin
  values:
    runtimeClassName: nvidia
    extraEnv:
      - name: DCGM_EXPORTER_COLLECTORS
        value: /etc/dcgm-exporter/default-counters.csv

  # Add a startupProbe and drop the chart's defensive 45s initialDelaySeconds
  # via Kustomize post-render. The dcgm-exporter chart doesn't expose
  # startupProbe as a value. Real startup is ~1s; the chart's 45s buffer made
  # pods appear NotReady for 45+ seconds even though `/health` answered
  # immediately.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: dcgm-exporter
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
                value: 0
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
                value: 0
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /health
                    port: 9400
                    scheme: HTTP
                  periodSeconds: 5
                  failureThreshold: 12
                  timeoutSeconds: 2
