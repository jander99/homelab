---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: '0.19.3'
      sourceRef:
        kind: HelmRepository
        name: nvdp
        namespace: flux-system
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Run the device plugin pod with the nvidia container runtime so NVML
    # libraries are mounted into the container. Without this the plugin crashes
    # with ERROR_LIBRARY_NOT_FOUND when using the default runc runtime.
    runtimeClassName: nvidia
    # GPU time-slicing: advertise 2 virtual GPU slots from the single RTX 3070.
    # The resources list is required by the v1 config schema; omitting it causes
    # the plugin to fail with 'no resources specified'.
    config:
      map:
        default: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 2
    # Chart default is `resources: {}` (unbounded) — krr (2026-08-13, post-#284)
    # flagged this as WARNING with no request/limit data at all. Pinned to the
    # krr floor recommendation (10m/100Mi); no CPU limit. Only bounds the
    # `nvidia-device-plugin-ctr` container — the chart's `-sidecar` init-style
    # container (config copy step) has no resources templating at all and stays
    # unbounded regardless of this value; that's a chart limitation, not
    # something fixable from values.
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
