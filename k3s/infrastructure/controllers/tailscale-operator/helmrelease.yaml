---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: tailscale
  chart:
    spec:
      chart: tailscale-operator
      version: '1.104.7'
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # OAuth credentials come from the SOPS secret `operator-oauth`
    # (keys: client_id, client_secret) in the tailscale namespace.
    # Leaving oauth.clientId unset makes the chart mount that secret.
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
