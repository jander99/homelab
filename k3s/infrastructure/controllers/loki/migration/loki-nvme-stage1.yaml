---
# loki local-path -> longhorn-nvme-local migration, stage 1. Operator-applied (NOT in a kustomization.yaml).
# Copies the StatefulSet-managed PVC (local-path) into a temporary PVC on longhorn-nvme-local.
# See applications/monitoring/migration/metrics-to-nvme.md for the full procedure.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-intermediate
  namespace: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-nvme-local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-nvme-copy-stage1
  namespace: telemetry
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: loki-nvme-copy-stage1
    spec:
      restartPolicy: Never
      containers:
        - name: rsync
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache rsync >/dev/null
              echo "=== source ==="
              ls -la /src
              echo "=== running rsync ==="
              rsync -aHAX --numeric-ids /src/ /dst/
              echo "=== verify ==="
              echo "src files: $(find /src -type f | wc -l)"
              echo "dst files: $(find /dst -type f | wc -l)"
              echo "src bytes: $(du -sb /src | cut -f1)"
              echo "dst bytes: $(du -sb /dst | cut -f1)"
              echo "DONE"
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: dest
              mountPath: /dst
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: storage-loki-0
        - name: dest
          persistentVolumeClaim:
            claimName: loki-intermediate
