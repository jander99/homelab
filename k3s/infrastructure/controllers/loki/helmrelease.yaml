---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: telemetry
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "18.11.0"
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: flux-system
      interval: 12h
  values:
    # Single binary (Monolithic) mode. `SingleBinary` is deprecated as of
    # community chart 12.0.0 — use `Monolithic` explicitly. 1 replica on a
    # single-node testbed is correct; multi-replica requires object storage.
    deploymentMode: Monolithic

    loki:
      # Multi-tenancy enabled explicitly so the intended auth model is
      # declared (X-Scope-OrgID header required on every write/query) rather
      # than relying on the chart's implicit default.
      auth_enabled: true
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        allow_structured_metadata: true
        retention_period: 168h  # 7 days, matches Tempo
      compactor:
        retention_enabled: true
        # working_directory must be on the Loki storage PVC. The chart mounts
        # the PVC at /var/loki (chunks go to /var/loki/chunks, rules to
        # /var/loki/rules). The default path /data/loki/compactor is not
        # mounted — Loki's mkdir fails with "read-only file system" on the
        # standard distroless container.
        working_directory: /var/loki/compactor
        # delete_request_store is required whenever retention_enabled is true
        # (Loki's Validate() refuses to start otherwise). Filesystem storage
        # reuses the same PVC as the chunks — no extra wiring needed.
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        size: 20Gi
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce

    # Zero out the other deployment modes — Monolithic runs everything in
    # singleBinary; the mode-specific components are unusable on this chart.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    indexGateway:
      replicas: 0

    # Built-in MinIO subchart is deprecated and removed 2026-10-31. Disable
    # entirely; filesystem storage doesn't need it.
    minio:
      enabled: false

    # Gateway is the cluster-internal entry point: Alloy + Grafana both dial
    # http://loki-gateway.telemetry.svc.cluster.local:80. One nginx pod is
    # plenty for this scale.
    gateway:
      enabled: true
      replicas: 1
      # The chart's default gateway.affinity is a *required* pod
      # anti-affinity (one gateway pod per node). With replicas=1 and the
      # Deployment default maxUnavailable=0/maxSurge=25%->1, that deadlocks
      # every rolling update on this single-node cluster: the surge pod can
      # never schedule alongside the old one (only one node to avoid), and
      # the old one won't terminate until the surge pod is Ready. Hit during
      # the chart 18.7.6 -> 18.11.0 bump (PR #301); required manually
      # deleting the old pod to unblock. Emptying affinity removes the
      # constraint entirely, which is safe here since there's only ever one
      # gateway replica anyway.
      affinity: {}

    # Allow kube-prometheus-stack Prometheus to scrape Loki's metrics.
    serviceMonitor:
      enabled: true

    # All three caches disabled: single-node filesystem deployment has no
    # scale pressure worth caching. memcached (chart subchart), chunksCache,
    # and resultsCache are all explicitly off.
    memcached:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Canary is required by the chart's validate.yaml hook. Keep it minimal.
    lokiCanary:
      enabled: true
      replicas: 1

    # CPU limits intentionally unset (Go GC throttling is a footgun on this
    # workload class). Memory is bounded, CPU is left to the kernel.
    defaults:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
