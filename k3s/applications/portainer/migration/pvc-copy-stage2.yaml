---
# Stage-2 copy Job: rsync from the intermediate `portainer-hostpath` PVC to
# the chart-managed `portainer` PVC (which has been recreated on
# csi-hostpath-sc during cutover).
#
# Why two stages: Helm chart owns the `portainer` PVC by name, so we can't
# have two PVCs named `portainer` at once. The intermediate is populated
# first while the chart-managed PVC still holds the original data on
# local-path; once the chart-managed PVC is deleted and recreated on
# csi-hostpath-sc (empty), we copy from intermediate into the new home and
# delete the intermediate.
apiVersion: batch/v1
kind: Job
metadata:
  name: portainer-pvc-copy-stage2
  namespace: portainer
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: portainer-pvc-copy
    spec:
      restartPolicy: Never
      containers:
        - name: rsync
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache rsync >/dev/null
              echo "=== source tree (top-level) ==="
              ls -la /src
              echo "=== running rsync ==="
              rsync -aHAX --numeric-ids /src/ /dst/
              echo "=== ownership correction ==="
              chmod -R u+rwX /dst
              echo "=== post-rsync verify ==="
              echo "src files: $(find /src -type f | wc -l)"
              echo "dst files: $(find /dst -type f | wc -l)"
              echo "src bytes: $(du -sb /src | cut -f1)"
              echo "dst bytes: $(du -sb /dst | cut -f1)"
              echo "DONE"
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: dest
              mountPath: /dst
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: portainer-hostpath
        - name: dest
          persistentVolumeClaim:
            claimName: portainer
