---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
  namespace: portainer
spec:
  interval: 1h
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: portainer
      version: "239.7.0"
      sourceRef:
        kind: HelmRepository
        name: portainer
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1

    service:
      type: ClusterIP
      httpPort: 9000

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: portainer.homelab.properties
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: portainer-tls
          hosts:
            - portainer.homelab.properties

    persistence:
      enabled: true
      size: "10Gi"
      # -- Migrated from csi-hostpath-sc to longhorn in
      # feat/portainer-longhorn. The Restore CR in migration/restore.yaml
      # creates a new 'portainer' PVC on longhorn and populates it from
      # the latest kopia snapshot; the chart's PVC template then matches
      # what's already there and Helm doesn't recreate it. The previous
      # `portainer-hostpath` intermediate PVC from the local-path →
      # csi-hostpath-sc migration (migration/pvc-hostpath.yaml) is no
      # longer needed and is deleted separately after the migration is
      # verified.
      storageClass: longhorn
      accessMode: ReadWriteOnce

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

  # Add a startupProbe and drop the chart's defensive 45s initialDelaySeconds
  # via Kustomize post-render. The portainer chart doesn't expose startupProbe
  # as a value. Real startup is ~16s; the chart's 45s buffer made the Service
  # endpoints wait 61s after container start. With a startupProbe, the readiness
  # probe takes over after first success.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: portainer
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
                value: 0
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
                value: 0
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /
                    port: 9443
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 18
                  timeoutSeconds: 2
