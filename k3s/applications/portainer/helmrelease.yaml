---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
  namespace: portainer
spec:
  interval: 1h
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: portainer
      version: "239.5.0"
      sourceRef:
        kind: HelmRepository
        name: portainer
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1

    service:
      type: ClusterIP
      httpPort: 9000

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: portainer.homelab.properties
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: portainer-tls
          hosts:
            - portainer.homelab.properties

    persistence:
      enabled: true
      size: "10Gi"
      # -- csi-hostpath-sc is the only SC in this cluster that supports
      # VolumeSnapshots, which is required for kopiur backup coverage.
      # Migration from local-path was performed imperatively (Helm won't
      # recreate an existing PVC just because the chart value changed);
      # the imperative flow uses an intermediate `portainer-hostpath`
      # PVC on csi-hostpath-sc, an rsync stage-1, then a chart-managed
      # `portainer` PVC recreated on csi-hostpath-sc and an rsync
      # stage-2 into it. Manifests in `migration/`.
      storageClass: csi-hostpath-sc
      accessMode: ReadWriteOnce

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

  # Add a startupProbe and drop the chart's defensive 45s initialDelaySeconds
  # via Kustomize post-render. The portainer chart doesn't expose startupProbe
  # as a value. Real startup is ~16s; the chart's 45s buffer made the Service
  # endpoints wait 61s after container start. With a startupProbe, the readiness
  # probe takes over after first success.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: portainer
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
                value: 0
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
                value: 0
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /
                    port: 9443
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 18
                  timeoutSeconds: 2
