---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 1h
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pihole
      version: "2.38.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600-pihole
        namespace: flux-system
      interval: 12h
  values:
    # Pi-hole v6 (appVersion: 2026.07.2) — chart version 2.38.0
    replicaCount: 1

    # -- Pi-hole container image: pin to specific version for Dependabot tracking.
    # 2026.07.2 fixes GHSA-h8w9-qx2v-wrww (local privilege escalation from the
    # pihole user to root via /etc/pihole/logrotate). No FTL-side config/API
    # changes vs 2026.05.0.
    image:
      tag: "2026.07.2"

    # -- Upstream DNS: plain DNS to Cloudflare
    DNS1: "1.1.1.1"
    DNS2: "1.0.0.1"

    # -- Web UI virtual host (must match ingress host to avoid redirects)
    virtualHost: "pihole.homelab.properties"

    # -- DNS service: LoadBalancer at 192.168.1.201 via MetalLB, TCP+UDP combined
    serviceDns:
      mixedService: true
      type: LoadBalancer
      port: 53
      externalTrafficPolicy: Local
      annotations:
        metallb.io/loadBalancerIPs: "192.168.1.201"

    # -- DHCP: disabled (K3s cluster, no DHCP needed)
    serviceDhcp:
      enabled: false

    # -- Web service: ClusterIP only (accessed via Ingress)
    serviceWeb:
      type: ClusterIP
      http:
        enabled: true
        port: 80
      https:
        enabled: false

    # -- Ingress: Traefik + letsencrypt-prod TLS
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      path: /
      pathType: Prefix
      hosts:
        - pihole.homelab.properties
      tls:
        - secretName: pihole-tls
          hosts:
            - pihole.homelab.properties

    # -- Admin password from SOPS-decrypted secret
    admin:
      existingSecret: "pihole-admin-password"
      passwordKey: "password"

    # -- PVC persistence: longhorn, 1Gi, for /etc/pihole
    # Migrated from csi-hostpath-sc to longhorn in feat/pihole-longhorn.
    # The Restore CR in migration/restore.yaml creates a fresh longhorn PVC
    # and populates it from the latest kopia snapshot BEFORE this chart value
    # change ships. When the HelmRelease next reconciles after the PR merges,
    # the chart's PVC template matches what's already there and Helm does not
    # recreate the PVC.
    persistentVolumeClaim:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "1Gi"
      storageClass: "longhorn"

    # -- Probes: initialDelaySeconds: 30 — FTL is up in ~5s, the chart's
    #    default is 60s. 30s leaves a small buffer for first-boot gravity DB
    #    upgrades without making the Service endpoints wait the full
    #    minute+ that the chart default or the previous 120s value imposed.
    #    On warm boots the pod becomes Ready ~30s after container start.
    #    Reduced from 120 after observing actual FTL startup time
    #    (~5s) and the chart default (60s).
    probes:
      liveness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 10
        timeoutSeconds: 5
      readiness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 10
        timeoutSeconds: 5

    # -- DoH sidecar: disabled (cloudflared proxy-dns deprecated Nov 2025)
    doh:
      enabled: false

    # -- Monitoring: Pi-hole v6 does not expose native Prometheus metrics on port 80.
    # The monitoring sidecar (prometheus-exporter) is required to scrape pi-hole's API
    # PodMonitor is used (not ServiceMonitor) because the pihole Helm chart natively generates a PodMonitor
    monitoring:
      podMonitor:
        enabled: true
      sidecar:
        enabled: true
        image:
          # ekofr/pihole-exporter: v1.2.0 required for Pi-hole v6 API
          tag: "v1.2.0"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # -- Pod DNS config: ensure pihole pod uses external DNS, not itself
    podDnsConfig:
      enabled: true
      policy: "None"
      nameservers:
        - 8.8.8.8

    # -- Resource requests/limits for the Pi-hole container
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 512Mi

    # -- Required for Pi-hole to listen on all interfaces in K3s CNI
    extraEnvVars:
      FTLCONF_dns_listeningMode: "all"
