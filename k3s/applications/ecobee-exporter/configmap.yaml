---
# Not a Secret: this is the ecobee-exporter project's own public default
# appkey (documented in its README/--help), shared by every self-hosted
# instance of the tool that hasn't registered a dedicated Ecobee app yet.
# It's enough to complete PIN pairing and start scraping metrics.
#
# It's shared across all default-config deployments of this exporter, so it
# may be rate-limited. To switch to a dedicated key: register an app at
# https://www.ecobee.com/home/developer/api/menu/homeMenu.jsp
# (Authorization Method: "Ecobee PIN"), create ecobee-credentials.sops.yaml
# from the .example template in this directory, then point
# ECOBEE_APPKEY in deployment.yaml at that secret instead of this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecobee-exporter-config
  namespace: ecobee-exporter
data:
  appkey: p3NbLx6iSYTjXDFHIMtM77SWWPLRuEZ0
