---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  # ⚠️  HARD BLOCKER: This secret MUST be created in the ecobee-exporter namespace
  # before Flux can reconcile this app. The pod will fail to start without it.
  # Steps:
  #   cp ecobee-credentials.sops.yaml.example ecobee-credentials.sops.yaml
  #   # Edit appkey with your actual Ecobee Application API Key (see the
  #   # .example file for how to register an app and obtain one)
  #   SOPS_AGE_KEY_FILE=~/.kube/k3s-homelab-age.agekey sops --encrypt --in-place ecobee-credentials.sops.yaml
  #
  #   git add ecobee-credentials.sops.yaml
  #   git commit -m 'feat(ecobee-exporter): add SOPS-encrypted credentials'
  #   # Then uncomment the line below:
  # - ecobee-credentials.sops.yaml
