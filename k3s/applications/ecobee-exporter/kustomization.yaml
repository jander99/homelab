---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  # OPTIONAL upgrade: deployment.yaml defaults ECOBEE_APPKEY to the exporter's
  # public demo appkey (configmap.yaml), so this app deploys with no secret
  # setup. To switch to a dedicated, non-shared Ecobee app key later:
  #   cp ecobee-credentials.sops.yaml.example ecobee-credentials.sops.yaml
  #   # Edit appkey with your actual Ecobee Application API Key (see the
  #   # .example file for how to register an app and obtain one)
  #   SOPS_AGE_KEY_FILE=~/.kube/k3s-homelab-age.agekey sops --encrypt --in-place ecobee-credentials.sops.yaml
  #
  #   git add ecobee-credentials.sops.yaml
  #   git commit -m 'feat(ecobee-exporter): switch to dedicated Ecobee app key'
  #   # Then uncomment the line below AND repoint deployment.yaml's
  #   # ECOBEE_APPKEY at secretKeyRef: {name: ecobee-credentials, key: appkey}
  # - ecobee-credentials.sops.yaml
