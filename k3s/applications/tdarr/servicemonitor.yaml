---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tdarr-exporter
  namespace: tdarr
  labels:
    app.kubernetes.io/name: tdarr-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tdarr-exporter
  namespaceSelector:
    matchNames:
      - tdarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
