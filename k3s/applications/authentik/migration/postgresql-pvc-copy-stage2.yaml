---
# Stage-2 copy Job for authentik-postgresql: rsync from the
# `authentik-postgresql-hostpath` intermediate PVC (csi-hostpath-sc,
# populated by stage-1) to the chart-managed
# `data-authentik-postgresql-0` PVC (csi-hostpath-sc, freshly provisioned,
# empty).
#
# Stage-2 runs only after the StatefulSet has been recreated with the
# updated volumeClaimTemplate so the chart-managed PVC exists on
# csi-hostpath-sc. The postgres pod must be scaled to 0 for the duration
# of this copy because both source and destination are RWO and the
# postgres pod holds the destination mount.
#
# Both source and destination PVCs have the same directory layout
# (/bitnami/postgresql/{data,conf}) so a flat rsync preserves it.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-postgresql-pvc-copy-stage2
  namespace: authentik
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: authentik-postgresql-pvc-copy
    spec:
      restartPolicy: Never
      containers:
        - name: rsync
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache rsync >/dev/null
              echo "=== source ==="
              ls -la /src
              echo "=== running rsync ==="
              rsync -aHAX --numeric-ids /src/ /dst/
              echo "=== ownership correction (postgres UID 1001) ==="
              chown -R 1001:1001 /dst/data 2>/dev/null || true
              chown -R 1001:1001 /dst/conf 2>/dev/null || true
              echo "=== verify ==="
              echo "src files: $(find /src -type f | wc -l)"
              echo "dst files: $(find /dst -type f | wc -l)"
              echo "src bytes: $(du -sb /src | cut -f1)"
              echo "dst bytes: $(du -sb /dst | cut -f1)"
              echo "DONE"
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: dest
              mountPath: /dst
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: authentik-postgresql-hostpath
        - name: dest
          persistentVolumeClaim:
            claimName: data-authentik-postgresql-0
