---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 1h
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: gatus
        namespace: flux-system
      interval: 12h
  values:
    # Use pre-created ConfigMap (key MUST be config.yaml)
    # Chart's _pod.tpl has TWO ConfigMap references: the volume mount uses
    # .Values.externalConfigMap, but envFrom hardcodes the release name
    # (`names.fullname`). So the ConfigMap must be named `gatus` — the
    # release name — to satisfy both.
    externalConfigMap: gatus

    # PVC for history persistence (sqlite at /data/data.db)
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path

    # Ingress with Traefik + cert-manager + cross-namespace Authentik forwardAuth
    ingress:
      enabled: true
      ingressClassName: traefik
      path: /
      pathType: Prefix
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        # Reference the Authentik forwardAuth middleware in the monitoring namespace
        # Traefik cross-namespace middleware reference: <namespace>-<name>@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: monitoring-authentik-forwardauth@kubernetescrd
      hosts:
        - gatus.homelab.properties
      tls:
        - secretName: gatus-tls
          hosts:
            - gatus.homelab.properties

    # Light resources (Gatus is a small Go binary with negligible footprint)
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    service:
      type: ClusterIP
      port: 80
      portName: http
      targetPort: 8080
