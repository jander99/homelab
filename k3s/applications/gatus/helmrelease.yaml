---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 1h
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: gatus
        namespace: flux-system
      interval: 12h
  values:
    # Use pre-created ConfigMap (key MUST be config.yaml)
    # Chart's _pod.tpl has TWO ConfigMap references: the volume mount uses
    # .Values.externalConfigMap, but envFrom hardcodes the release name
    # (`names.fullname`). So the ConfigMap must be named `gatus` — the
    # release name — to satisfy both.
    externalConfigMap: gatus

    # Pin image tag explicitly. Chart appVersion is v5.34.0, but v5.34+
    # has native OIDC support; v5.36.0 is the latest Gatus at chart time.
    # Per AGENTS.md: chart version != image tag, pin explicitly.
    image:
      tag: v5.36.0

    # Inject OIDC credentials from the SOPS-encrypted secret. The values
    # are then referenced in config.yaml as ${OIDC_CLIENT_ID} and
    # ${OIDC_CLIENT_SECRET} — Gatus's env-var substitution in the config.
    # The chart's _pod.tpl appends `.Values.envFrom` to its own
    # built-in envFrom (which references the configMap and (when
    # .Values.secrets is set) the release-name secret). Field name is
    # `envFrom`, not `extraEnvFrom` — the chart silently ignores
    # unknown keys, so #243 left the OIDC env vars unset and the pods
    # panicked with "invalid security configuration" on every start.
    envFrom:
      - secretRef:
          name: gatus-oidc-secret

    # PVC for history persistence (sqlite at /data/data.db)
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
      accessModes:
        - ReadWriteOnce
      storageClassName: csi-hostpath-sc

    # Ingress with Traefik + cert-manager. Auth is now Gatus-native OIDC
    # (via the security.oidc block in config.yaml), so no Traefik
    # forwardAuth middleware is needed.
    ingress:
      enabled: true
      ingressClassName: traefik
      path: /
      pathType: Prefix
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - gatus.homelab.properties
      tls:
        - secretName: gatus-tls
          hosts:
            - gatus.homelab.properties

    # Light resources (Gatus is a small Go binary with negligible footprint)
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    service:
      type: ClusterIP
      port: 80
      portName: http
      targetPort: 8080
