---
# Gatus
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
data:
  config.yaml: |
    metrics: false
    storage:
      type: sqlite
      path: /data/data.db
    security:
      oidc:
        issuer-url: https://auth.homelab.properties/application/o/gatus/
        redirect-url: https://gatus.homelab.properties/authorization-code/callback
        client-id: ${OIDC_CLIENT_ID}
        client-secret: ${OIDC_CLIENT_SECRET}
        scopes:
          - openid
          - email
          - profile
    ui:
      title: "Homelab Health Dashboard"
      header: "Homelab Status"
      dashboard-heading: "Homelab Services"
      dashboard-subheading: "Live health status of homelab services"
      dark-mode: true
    endpoints:
      # auth group
      - name: authentik
        group: auth
        url: https://auth.homelab.properties/-/health/ready/
        interval: 60s
        # The body of /-/health/ready/ is HTML (the login page redirect,
        # not a JSON health status), so the [BODY].status check fails —
        # the body isn't a JSON document. The existing blackbox probe
        # uses the same URL and just checks 2xx/3xx. Drop the body check.
        conditions:
          - "[STATUS] == 200"

      # dashboards group
      - name: headlamp
        group: dashboards
        url: https://headlamp.homelab.properties/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: portainer
        group: dashboards
        url: https://portainer.homelab.properties/api/system/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      # media group
      - name: tdarr
        group: media
        # The actual API server is on port 8266 — port 8265 is the webui
        # and doesn't expose /api/v1/health (returns 404). The existing
        # blackbox probe uses 8266 too. Tdarr redirects unauthenticated
        # requests to login, so accepting sub-400 status codes is the
        # right check (matches the blackbox probe's http_2xx module).
        url: http://tdarr.homelab.properties:8266/api/v1/health
        interval: 60s
        client:
          follow-redirects: false
          timeout: 10s
        conditions:
          - "[STATUS] < 400"

      # monitoring group
      - name: grafana
        group: monitoring
        url: https://grafana.homelab.properties/api/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].database == ok"

      - name: prometheus
        group: monitoring
        url: https://prometheus.homelab.properties/-/healthy
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      # dns group
      - name: pihole
        group: dns
        url: https://pihole.homelab.properties/admin/login
        interval: 60s
        conditions:
          - "[STATUS] == 200"
