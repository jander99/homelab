---
# Intermediate PVC for grafana storage class migration (local-path → csi-hostpath-sc).
# Populated via rsync from the existing `kube-prometheus-stack-grafana` PVC
# (local-path), then data is moved to a fresh PVC with the same name on
# csi-hostpath-sc, and this intermediate is deleted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-hostpath
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: 5Gi
