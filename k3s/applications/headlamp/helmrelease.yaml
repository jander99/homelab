---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  values:
    # capabilities.drop and readOnlyRootFilesystem are opt-in in the chart's
    # default values.yaml (commented out). Enabling both here; the chart
    # auto-provisions a writable emptyDir (headlamp-tmp) mounted at /tmp
    # when readOnlyRootFilesystem is true, so no extra volume config is
    # needed on our side. runAsNonRoot/privileged/runAsUser/runAsGroup are
    # left unset since the chart already defaults those correctly.
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: headlamp.homelab.properties
          paths:
            - path: /
              type: Prefix
      tls:
        - secretName: headlamp-tls
          hosts:
            - headlamp.homelab.properties
    config:
      inCluster: true
      pluginsDir: /build/plugins
      oidc:
        clientID: headlamp
        issuerURL: https://auth.homelab.properties/application/o/headlamp/
        scopes: openid email profile offline_access
        externalSecret:
          enabled: true
          name: headlamp-oidc-secret
          # Required when the secret contains an OIDC_SCOPES key. The chart
          # gates the `-oidc-scopes=$(OIDC_SCOPES)` arg on this flag
          # (default false) and silently omits it otherwise, so the binary
          # falls back to its built-in default of `openid profile email`.
          # Without offline_access in the authorize URL, authentik never
          # issues a refresh token, and Headlamp forces re-auth every
          # session-ttl (24h) once the access token expires.
          hasScopes: true
    clusterRoleBinding:
      clusterRoleName: cluster-admin
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
      - name: headlamp-plugins-cert-manager
        image: ghcr.io/headlamp-k8s/headlamp-plugin-cert-manager:v0.1.0
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
    persistentVolumeClaim:
      accessModes:
        - ReadWriteOnce
      enabled: true
      size: 1Gi
      # Migrated from csi-hostpath-sc to longhorn (paired with the
      # Restore CR in migration/restore.yaml). The Restore creates a
      # new 'headlamp' PVC on longhorn and populates it from the
      # latest kopia snapshot; the chart's PVC template then matches
      # what's already there and Helm doesn't recreate it.
      storageClassName: longhorn
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins
    volumes:
      - name: headlamp-plugins
        persistentVolumeClaim:
          claimName: headlamp
