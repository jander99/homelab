apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "30 2 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          restartPolicy: OnFailure
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.3
              # recyclarr exits 0 even when a profile fails validation; fail the
              # Job on any [ERR] line so KubeJobFailed fires instead of silence.
              command:
                - sh
                - -c
                - |
                  set -o pipefail
                  recyclarr sync 2>&1 | tee /tmp/sync.log || exit $?
                  if grep -q '^\[ERR\]' /tmp/sync.log; then
                    echo "recyclarr reported errors; failing job" >&2
                    exit 1
                  fi
              env:
                - name: TZ
                  value: America/New_York
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
              envFrom:
                - secretRef:
                    name: recyclarr-secrets
              volumeMounts:
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: recyclarr-config
            - name: tmp
              emptyDir: {}
