---
# Restore CR for the qbittorrent-config csi-hostpath-sc → longhorn migration.
#
# Operator-applied (NOT in kustomization.yaml). Run with `kubectl apply -f`
# once after scaling qbittorrent to 0 replicas. Matches the pattern in
# radarr/migration/, prowlarr/migration/, headlamp/migration/ (see
# radarr/migration/restore.yaml for the full header rationale).
#
# Delete manually if desired:
#   kubectl delete restore -n qbittorrent qbittorrent-config-longhorn-migration
#
# Pre-conditions (operator must do before applying):
#   - qbittorrent deployment scaled to 0 replicas (releases RWO on old PVC).
#   - Stale csi-hostpath-snapclass VolumeSnapshots cleared (they hold
#     pvc-as-source-protection finalizers on the source PVC).
#   - The old csi-hostpath-sc PVC `qbittorrent-config` deleted (Restore's
#     target.pvc would otherwise hit a name conflict; data is safe in kopia).
#
# Post-conditions:
#   - PVC `qbittorrent-config` exists, bound on `longhorn`, populated with snapshot.
#   - qbittorrent deployment scaled back to 1 replica binds to longhorn PVC.
#   - Restored files are owned by UID 1027 GID 100 (LinuxServer qbittorrent
#     PUID/PGID), matching the policy's recorded snapshot metadata.
#
# credentialProjection: REQUIRED. ClusterRepository `nas` secret lives in
# kopiur-system, not qbittorrent. Without `credentialProjection.enabled: true`
# the Restore stalls with MissingCredentialsSecret.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: qbittorrent-config-longhorn-migration
  namespace: qbittorrent
spec:
  source:
    fromPolicy:
      name: qbittorrent
      offset: 0
  target:
    pvc:
      name: qbittorrent-config
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      capacity: 5Gi
  credentialProjection:
    enabled: true
  mover:
    inheritSecurityContextFrom:
      snapshot: {}
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
  failurePolicy:
    backoffLimit: 2
    activeDeadlineSeconds: 1800
  policy:
    onMissingSnapshot: Fail
---
# SUPERSEDED — DO NOT RE-APPLY. See migration/restore-gluetun-recovery.yaml.
#
# This Restore CR completed "successfully" but restored the WRONG data:
# kopiur's multi-source SnapshotPolicy bug (fixed in PR #318) meant
# `fromPolicy: qbittorrent` silently pulled the qbittorrent-config source
# for BOTH Restores below, so /gluetun ended up containing a `qBittorrent/`
# directory instead of real gluetun state. No error was reported —
# `Completed` phase, wrong content. Left here only as a historical record
# of the bug; the actual fix lives in restore-gluetun-recovery.yaml, which
# restores from the corrected, split `qbittorrent-gluetun` policy.
#
# Restore CR for the gluetun-config csi-hostpath-sc → longhorn migration.
#
# gluetun-config must be ready BEFORE qbittorrent deployment scales back up —
# the gluetun sidecar's /gluetun mount must be valid or its init fails and
# the whole pod stays Pending. Apply this Restore CR alongside the
# qbittorrent-config one above so both PVCs are restored in lockstep.
#
# The snapshot policy `qbittorrent` covers BOTH `qbittorrent-config` and
# `gluetun-config` as separate `sources:` entries, so this Restore pulls the
# /gluetun subpath of the most recent successful snapshot.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: gluetun-config-longhorn-migration
  namespace: qbittorrent
spec:
  source:
    fromPolicy:
      name: qbittorrent
      offset: 0
  target:
    pvc:
      name: gluetun-config
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      capacity: 1Gi
  credentialProjection:
    enabled: true
  mover:
    inheritSecurityContextFrom:
      snapshot: {}
    cache:
      capacity: 1Gi
      storageClassName: local-path
      mode: Ephemeral
  failurePolicy:
    backoffLimit: 2
    activeDeadlineSeconds: 1800
  policy:
    onMissingSnapshot: Fail
