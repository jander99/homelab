---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: velero-backups
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-media
  mountOptions:
    - vers=3.0
    - dir_mode=0777
    - file_mode=0777
    - uid=1027
    - gid=100
    - noperm
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: velero-backups-volume
    volumeAttributes:
      source: //192.168.1.20/data
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velero-backups
  namespace: velero
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-media
  volumeName: velero-backups
  resources:
    requests:
      storage: 1Ti
