name: Ansible Lint

on:
  pull_request:
    paths:
      - "k3s/bootstrap/ansible/**"
      - ".github/workflows/ansible-lint.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_LINT_VERSION: "26.9.0"

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k3s/bootstrap/ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ansible-lint
        run: pip install ansible-lint==${{ env.ANSIBLE_LINT_VERSION }}

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: |
          for pb in playbooks/*.yml; do ansible-playbook --syntax-check "$pb"; done

      - name: ansible-lint
        run: ansible-lint
